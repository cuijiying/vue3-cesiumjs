name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build-only
        env:
          # Absolute base keeps Vue Router history mode correct on project Pages
          VITE_BASE: /vue3-cesiumjs/

      # vite-plugin-cesium copies into dist${base}/cesium; Pages already serves under /vue3-cesiumjs/
      - name: Fix Cesium asset path for GitHub Pages
        run: |
          if [ -d dist/vue3-cesiumjs/cesium ]; then
            mv dist/vue3-cesiumjs/cesium dist/cesium
            rm -rf dist/vue3-cesiumjs
          fi

      # SPA deep links on GitHub Pages
      - name: Add 404.html for client routes
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
